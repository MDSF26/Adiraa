/* ---------- tokens: the ådirá colors, unchanged ---------- */
:root{
  --red:#CE1126; --red-dark:#9E0D1D; --red-soft:#FBE9EB;
  --cream:#F7F1E8; --paper:#FFFFFF; --line:#ECE3D6; --ink:#231A15; --muted:#8C7F75;
  --display:"Kufi","Readex",system-ui,sans-serif;
  --body:"Readex",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --gutter:clamp(16px,4vw,40px);
}
h1,h2,h3,.hero h1,.name-alt{word-spacing:.14em}
html[dir=rtl] h1,html[dir=rtl] h2,html[dir=rtl] h3,html[dir=rtl] .hero-shelf .shelf-label strong{word-spacing:.1em}
.alt[dir=ltr]{word-spacing:0}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:140px}
body{background:var(--cream);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2.5px solid var(--red);outline-offset:3px;border-radius:6px}
.wrap{max-width:1280px;margin:0 auto;padding-inline:var(--gutter)}
.hidden{display:none!important}
.alt{font-family:var(--body);color:var(--muted);font-weight:400}
.num{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:40;background:rgba(247,241,232,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:24px;height:72px}
.logo img{height:36px;width:auto}
.search{flex:1;max-width:460px;margin-inline:auto;display:flex;align-items:center;gap:10px;height:44px;padding-inline:16px;background:var(--paper);border:1px solid var(--line);border-radius:999px;cursor:text;transition:border-color .15s}
.search:focus-within{border-color:var(--red)}
.search svg{width:17px;height:17px;flex:none;stroke:var(--muted);fill:none;stroke-width:2}
.search input{border:0;outline:0;background:none;width:100%;height:100%;font-size:.95rem}
.search input::placeholder{color:#AA9E94}
.top-act{display:flex;align-items:center;gap:10px}
.lang{height:40px;padding-inline:14px;border-radius:999px;font-weight:600;font-size:.9rem;color:var(--ink);border:1px solid var(--line);background:var(--paper)}
.lang:hover{border-color:var(--ink)}
.basket{display:flex;align-items:center;gap:10px;height:44px;padding-inline:18px 8px;border-radius:999px;background:var(--red);color:#fff;font-weight:600;font-size:.95rem;transition:background .15s}
html[dir=rtl] .basket{padding-inline:18px 8px}
.basket:hover{background:var(--red-dark)}
.basket svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.basket b{min-width:28px;height:28px;padding-inline:8px;border-radius:999px;background:#fff;color:var(--red);display:grid;place-items:center;font-size:.85rem;font-variant-numeric:tabular-nums}
.rail{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:0 12px}
.rail::-webkit-scrollbar{display:none}
.rail a{flex:none;display:flex;align-items:center;gap:8px;height:36px;padding-inline:14px;border-radius:999px;font-size:.9rem;font-weight:600;color:#5E544C;transition:background .15s,color .15s}
.rail a:hover{background:var(--paper);color:var(--ink)}
.rail a[aria-current=true]{background:var(--ink);color:#fff}
.dia{display:inline-block;width:9px;height:9px;flex:none;background:var(--c,var(--red));transform:rotate(45deg);border-radius:1.5px}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(24px,5vw,72px);align-items:end;padding-block:clamp(28px,5vw,64px) 16px}
.hero h1{font-family:var(--display);font-weight:700;line-height:1.02;letter-spacing:-.01em}
.hero h1 .l1{display:block;font-size:clamp(2.6rem,6.2vw,5.2rem)}
.hero h1 .l2{display:block;color:var(--red);font-size:clamp(1.7rem,3.6vw,3rem);margin-top:.3em}
html[dir=rtl] .hero h1{line-height:1.25}
.lede{margin-top:22px;max-width:44ch;font-size:1.06rem;color:#4A413A}
.steps{list-style:none;padding:0;margin-top:28px;display:grid;gap:10px;counter-reset:s}
.steps li{counter-increment:s;display:flex;align-items:center;gap:14px;font-weight:600;font-size:.95rem}
.steps li::before{content:counter(s);width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--red);color:var(--red);font-family:var(--display);font-size:.9rem}
.steps li:last-child::before{background:var(--red);color:#fff}
.hero-shelf .shelf{grid-template-columns:repeat(4,minmax(0,1fr))}
.hero-shelf .tag{padding-inline:10px}
.hero-shelf .tag-foot{flex-direction:column;align-items:stretch;gap:8px}
.hero-shelf .tag-foot .plus,.hero-shelf .tag-foot .step{align-self:flex-end}
.hero-shelf .price.tbc{font-size:.74rem}
.hero-shelf .shelf-label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-size:.85rem;color:var(--muted)}
.hero-shelf .shelf-label strong{font-family:var(--display);font-weight:600;color:var(--ink);font-size:1rem}

/* ---------- the dukkan shelf: signature ---------- */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));column-gap:0;row-gap:34px}
.item{min-width:0;display:flex;flex-direction:column}
.jar{position:relative;display:block;aspect-ratio:1/1;isolation:isolate;overflow:hidden;background:var(--cream)}
.jar::after{content:"";position:absolute;inset-inline:0;bottom:0;height:14%;background:linear-gradient(var(--red) 0 58%,var(--red-dark) 58% 100%);z-index:0}
.jar img,.jar svg{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.item:hover .jar img,.item:hover .jar svg{transform:translateY(-8px)}
.jar .badge{position:absolute;z-index:2;top:10px;inset-inline-start:12px;font-size:.68rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:#fff;background:var(--c,var(--red));padding:3px 9px;border-radius:4px}
.item.out .jar img{filter:grayscale(1);opacity:.5}
/* the tag clipped under the plank */
.tag{position:relative;margin:0 10px;padding:16px 14px 12px;background:var(--paper);border-radius:0 0 10px 10px;box-shadow:0 1px 0 var(--line),0 6px 16px rgba(35,26,21,.06);display:flex;flex-direction:column;flex:1}
.tag::before{content:"";position:absolute;top:0;left:50%;width:34px;height:6px;transform:translateX(-50%);background:var(--red-dark);border-radius:0 0 4px 4px;opacity:.9}
.tag h3{font-family:var(--display);font-weight:600;font-size:1.02rem;line-height:1.2;overflow-wrap:break-word;hyphens:auto;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tag .alt{font-size:.84rem;line-height:1.35;margin-top:2px}
.tag .unit{font-size:.76rem;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.tag-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:10px}
.price{font-weight:700;color:var(--red);font-size:1.1rem;font-variant-numeric:tabular-nums}
.price.tbc{font-weight:400;color:var(--muted);font-size:.8rem}
.plus{width:36px;height:36px;flex:none;border-radius:50%;background:var(--ink);display:grid;place-items:center;transition:background .15s,transform .15s}
.plus:hover{background:var(--red);transform:scale(1.06)}
.plus svg{width:15px;height:15px;stroke:#fff;stroke-width:2.8;fill:none;stroke-linecap:round}
.plus[disabled]{background:#D8D0C6;cursor:not-allowed;transform:none}
.step{display:inline-flex;align-items:center;background:var(--red-soft);border-radius:999px;padding:3px}
.step button{width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;font-weight:700;display:grid;place-items:center;line-height:1}
.step span{min-width:26px;text-align:center;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums}
.step.lg button{width:44px;height:44px;font-size:1.2rem}
.step.lg span{min-width:44px;font-size:1.1rem}

/* ---------- aisles (one per category) ---------- */
.aisle{padding-block:44px 8px}
.aisle-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-bottom:18px;margin-bottom:6px;border-bottom:2px solid var(--ink)}
.aisle-head h2{display:flex;align-items:center;gap:14px;font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,3vw,2.3rem);line-height:1.1}
.aisle-head h2 .dia{width:13px;height:13px}
.aisle-head h2 .alt{font-family:var(--display);font-weight:600;font-size:.6em;color:var(--muted)}
.aisle-head .count{font-size:.85rem;color:var(--muted);white-space:nowrap}
.aisle .shelf{margin-top:18px}
.empty{text-align:center;color:var(--muted);padding:64px 16px}
.empty strong{display:block;font-family:var(--display);font-size:1.5rem;color:var(--ink);margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding-inline:26px;border-radius:999px;background:var(--red);color:#fff;font-weight:600;font-size:1rem;transition:background .15s}
.btn:hover{background:var(--red-dark)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.ghost:hover{background:var(--ink);color:#fff}
.btn svg{width:22px;height:22px;fill:currentColor}
.btn.wide{width:100%}

/* ---------- product page ---------- */
.back{display:inline-flex;align-items:center;gap:6px;margin-top:22px;color:var(--muted);font-weight:600;font-size:.9rem}
.back:hover{color:var(--ink)}
.back svg{width:16px;height:16px}
html[dir=rtl] .back svg{transform:scaleX(-1)}
.pdp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,72px);align-items:center;padding-block:18px 20px}
.pdp .jar{max-width:560px;width:100%;margin-inline:auto}
.pdp .crumb{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:600;color:#5E544C}
.pdp h1{font-family:var(--display);font-weight:700;font-size:clamp(2rem,4.4vw,3.4rem);line-height:1.05;margin-top:14px}
.pdp .name-alt{font-family:var(--display);font-weight:600;color:var(--red);font-size:clamp(1.2rem,2.2vw,1.7rem);margin-top:6px}
.pdp .price{display:block;font-size:1.9rem;margin-top:22px}
.pdp .price.tbc{font-size:1rem}
.sizes{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.sizes a{height:40px;display:flex;align-items:center;padding-inline:16px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-weight:600;font-size:.88rem}
.sizes a:hover{border-color:var(--ink)}
.sizes a[aria-current=true]{border-color:var(--ink);background:var(--ink);color:#fff}
.pdp .desc{margin-top:22px;color:#4A413A;line-height:1.7;max-width:52ch}
.buy{display:flex;align-items:center;gap:14px;margin-top:28px;flex-wrap:wrap}
.buy .btn{flex:1;min-width:200px}
.soldout-note{margin-top:26px;padding:14px 16px;border-radius:12px;background:var(--red-soft);color:var(--red);font-weight:600}
.more{padding-block:20px 10px}

/* ---------- basket = receipt ---------- */
.checkout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start;padding-block:24px 40px}
.checkout h1{font-family:var(--display);font-weight:700;font-size:clamp(2rem,4vw,3rem);line-height:1.05;margin-bottom:20px}
.receipt{position:relative;background:var(--paper);padding:28px 26px 34px;box-shadow:0 10px 30px rgba(35,26,21,.08);
  -webkit-mask:radial-gradient(10px at 50% 100%,#0000 97%,#000) 50% 100%/20px 100% repeat-x, linear-gradient(#000,#000) top/100% calc(100% - 10px) no-repeat;
          mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/18px 100%}
.receipt-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:1.5px dashed var(--line)}
.receipt-head img{height:28px}
.receipt-head span{font-size:.8rem;color:var(--muted)}
.rline{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding-block:14px;border-bottom:1px dashed var(--line)}
.rline .q{font-weight:700;color:var(--red);font-variant-numeric:tabular-nums;min-width:26px}
.rline .n strong{display:block;font-weight:600;line-height:1.3}
.rline .n small{color:var(--muted);font-size:.8rem}
.rline .p{font-weight:600;text-align:end;font-variant-numeric:tabular-nums}
.rline .p.tbc{font-weight:400;color:var(--muted);font-size:.8rem}
.rline .ctl{grid-column:2/4;display:flex;justify-content:space-between;align-items:center}
.rline .rm{font-size:.8rem;color:var(--muted);text-decoration:underline}
.rsum{padding-top:14px;display:grid;gap:6px}
.rsum div{display:flex;justify-content:space-between;gap:12px;color:#5E544C;font-size:.95rem}
.rsum .total{margin-top:8px;padding-top:12px;border-top:2px solid var(--ink);color:var(--ink);font-family:var(--display);font-weight:700;font-size:1.35rem}
.rsum .total span:last-child{color:var(--red)}
.rnote{margin-top:12px;font-size:.8rem;color:var(--muted)}
.deliver{background:var(--paper);border-radius:18px;padding:26px;border:1px solid var(--line)}
.deliver h2{font-family:var(--display);font-weight:700;font-size:1.4rem;margin-bottom:16px}
form{display:grid;gap:12px}
label{display:grid;gap:6px;font-size:.85rem;font-weight:600}
input,select,textarea{border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:12px 14px;width:100%;font-weight:400;font-size:.95rem;transition:border-color .15s,background .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ink);background:#fff}
textarea{min-height:72px;resize:vertical}
.err{color:var(--red);font-size:.8rem;font-weight:600}
.err:empty{display:none}
.send{margin-top:20px}
.send-note{margin-top:10px;text-align:center;font-size:.8rem;color:var(--muted)}

/* ---------- footer, order bar, toast ---------- */
footer{margin-top:56px;background:var(--ink);color:#E9E1D6}
.foot-in{display:flex;flex-wrap:wrap;gap:20px 40px;justify-content:space-between;align-items:center;padding-block:34px}
.foot-in img{height:30px;filter:brightness(0) invert(1)}
.foot-in p{font-size:.9rem;color:#B8ADA2}
.foot-in a.wa{display:inline-flex;align-items:center;gap:10px;height:46px;padding-inline:20px;border-radius:999px;background:#fff;color:var(--ink);font-weight:600}
.foot-in a.wa svg{width:20px;height:20px;fill:#1FA855}
.orderbar{display:none}
.orderbar.off{visibility:hidden}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(10px);bottom:28px;background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;z-index:60;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;font-weight:600;font-size:.9rem;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- arrival: jars set down on the hero shelf ---------- */
@keyframes setdown{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
.hero-shelf .item{animation:setdown .5s cubic-bezier(.2,.8,.2,1) both}
.hero-shelf .item:nth-child(2){animation-delay:.08s}.hero-shelf .item:nth-child(3){animation-delay:.16s}.hero-shelf .item:nth-child(4){animation-delay:.24s}

/* ---------- responsive ---------- */
@media (max-width:1020px){
  .hero,.pdp,.checkout{grid-template-columns:minmax(0,1fr)}
  .hero{align-items:start}
}
@media (max-width:720px){
  html{scroll-padding-top:160px}
  .top-in{height:60px;gap:10px;flex-wrap:wrap}
  .logo img{height:28px}
  .top-act{margin-inline-start:auto}
  .basket{height:40px;padding-inline:12px 6px}
  .basket .lbl{display:none}
  .lang{height:36px;padding-inline:12px}
  .search{order:3;flex-basis:100%;max-width:none;height:42px;margin:0 0 10px}
  .top-in{height:auto;padding-top:10px}
  .rail{padding-bottom:10px}
  .rail a{height:34px;font-size:.85rem;padding-inline:12px}
  .hero{padding-top:22px}
  .lede{font-size:.98rem}
  .steps{margin-top:20px}
  .hero-shelf .shelf{grid-template-columns:repeat(2,minmax(0,1fr))}
  .shelf{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:26px}
  .tag{margin:0 6px;padding:14px 11px 10px}
  .tag h3{font-size:.92rem}
  .tag .alt{font-size:.78rem}
  .price{font-size:1rem}

/* ---------- data ---------- */
function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false; text=text.replace(/^﻿/,"");
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===","){ row.push(cell); cell=""; }
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&text[i+1]==="\n") i++; row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell+=c; }
  if(cell!==""||row.length){ row.push(cell); rows.push(row); }
  const head=(rows.shift()||[]).map(h=>h.trim().toLowerCase());
  return rows.filter(r=>r.some(x=>x.trim())).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]||"").trim()])));
}
const yes = v => /^(yes|y|true|1|نعم)$/i.test(v||"");
function toProducts(rows){
  return rows.map((r,i)=>({ id:r.id||String(i+1), category:r.category||"Other", category_ar:r.category_ar,
    name:r.name, name_ar:r.name_ar, description:r.description, description_ar:r.description_ar, details:r.details, details_ar:r.details_ar,
    price:(String(r.price||"").replace(/[^0-9.]/g,"")==="" ? null : parseFloat(String(r.price).replace(/[^0-9.]/g,""))),
    unit:r.unit, unit_ar:r.unit_ar, image:r.image, badge:r.badge, badge_ar:r.badge_ar, popular:yes(r.popular),
    available:!/^(no|n|false|0|sold out)$/i.test(r.available||"yes") })).filter(p=>p.name);
}
/* Accepts any Google Sheets link (sharing link, edit link, or published CSV link) */
function sheetCsvUrl(u){
  if(!u || u.startsWith("__")) return "";
  if(/\/spreadsheets\/d\/e\//.test(u) || /output=csv/.test(u)) return u;
  const m=u.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]{20,})/); if(!m) return u;
  const gid=(u.match(/[#&?]gid=(\d+)/)||[])[1];
  return `https://docs.google.com/spreadsheets/d/${m[1]}/gviz/tq?tqx=out:csv&headers=1${gid?"&gid="+gid:""}`;
}
async function loadProducts(){
  for(const src of [sheetCsvUrl(SHEET_CSV_URL),"products.csv"].filter(Boolean)){
    try{ const res=await fetch(src+(src.includes("?")?"&":"?")+"t="+Date.now()); if(!res.ok) throw 0;
         const txt=await res.text(); if(/^\s*</.test(txt)) throw 0; const list=toProducts(parseCSV(txt)); if(list.length) return list; }
    catch(e){ if(src!=="products.csv") setTimeout(()=>toast(t("loadFail")),600); }
  }
  return toProducts(parseCSV(FALLBACK_CSV));
}
function categories(){ const m=new Map(); products.forEach(p=>{ if(!m.has(p.category)) m.set(p.category,{en:p.category,ar:p.category_ar||p.category,color:CAT_COLORS[m.size%CAT_COLORS.length]}); }); return [...m.values()]; }
const catOf = c => categories().find(x=>x.en===c) || {en:c,ar:c,color:"#CE1126"};
const catName = (c,l=lang) => l==="ar"?catOf(c).ar:catOf(c).en;

/* ---------- pictures ---------- */
function jarSVG(seed,color){
  let h=0; for(const c of String(seed)) h=(h*31+c.charCodeAt(0))>>>0;
  const fills=["#E07A2F","#C8322B","#D9A13B","#8BA64A","#9C3B2E","#E5B85C","#7A2E3B"]; const fill=fills[h%fills.length];
  return `<svg viewBox="0 0 200 200" aria-hidden="true"><rect width="200" height="200" fill="#fff"/>
   <g transform="translate(62 38)"><rect x="8" y="0" width="60" height="16" rx="4" fill="#fff" stroke="#E4D9CB" stroke-width="2"/>
   <path d="M4 18h68v6c4 4 6 8 6 14v76c0 7-5 12-12 12H10c-7 0-12-5-12-12V38c0-6 2-10 6-14z" fill="${fill}"/>
   <rect x="-2" y="58" width="80" height="40" fill="#F8F2E9"/><rect x="-2" y="58" width="80" height="5" fill="${color}"/>
   <text x="38" y="86" text-anchor="middle" font-family="Arial" font-weight="800" font-size="16" fill="${color}">ådirá</text></g></svg>`;
}
function imgFail(img){
  const src=img.getAttribute("src")||"";
  if(!img.dataset.retried && src.includes("/")){ img.dataset.retried="1"; img.src=src.split("/").pop(); return; }
  const s=document.createElement("span"); s.innerHTML=jarSVG(img.dataset.seed,img.dataset.color); img.replaceWith(s.firstElementChild);
}
const picHTML = (p,eager) => p.image
  ? `<img src="${esc(p.image)}" alt="${esc(L(p,"name"))}" ${eager?"":'loading="lazy"'} data-seed="${esc(p.name)}" data-color="${catOf(p.category).color}" onerror="imgFail(this)">`
  : jarSVG(p.name,catOf(p.category).color);

function control(p){
  const n=cart[p.id]||0;
  if(!p.available) return `<button class="plus" disabled aria-label="${t("soldOut")}">${I.plus}</button>`;
  if(n) return `<div class="step"><button data-dec="${esc(p.id)}" aria-label="−">−</button><span>${n}</span><button data-inc="${esc(p.id)}" aria-label="+">+</button></div>`;
  return `<button class="plus" data-inc="${esc(p.id)}" aria-label="${t("add")}: ${esc(L(p,"name"))}">${I.plus}</button>`;
}
function item(p,eager){
  const href=`#/p/${encodeURIComponent(p.id)}`, badge=L(p,"badge"), c=catOf(p.category).color;
  const tag = !p.available ? `<span class="badge" style="--c:#6B625B">${t("soldOut")}</span>` : badge ? `<span class="badge" style="--c:${c}">${esc(badge)}</span>` : "";
  return `<article class="item${p.available?"":" out"}">
    <a class="jar" href="${href}">${picHTML(p,eager)}${tag}</a>
    <div class="tag">
      <a href="${href}"><h3>${esc(L(p,"name"))}</h3><p class="alt" lang="${other()}" dir="${other()==="ar"?"rtl":"ltr"}">${esc(Lo(p,"name"))}</p></a>
      <p class="unit">${esc(L(p,"unit"))}</p>
      <div class="tag-foot">${priceHTML(p)}${control(p)}</div>
    </div></article>`;
}
const shelf = (list,eager) => `<div class="shelf">${list.map(p=>item(p,eager)).join("")}</div>`;

  <section>
    <h1>${t("yourOrder")}</h1>
    <div class="receipt">
      <div class="receipt-head"><img src="logo-red.png" alt="ådirá"><span>${date}</span></div>
      ${list.map(({p,n})=>`<div class="rline">
        <span class="q">${n}×</span>
        <div class="n"><strong>${esc(L(p,"name"))}</strong><small>${esc(L(p,"unit"))}</small></div>
        <span class="p${p.price==null?" tbc":""}">${p.price==null?t("askPrice"):money(p.price*n)}</span>
        <div class="ctl"><div class="step"><button data-dec="${esc(p.id)}" aria-label="−">−</button><span>${n}</span><button data-inc="${esc(p.id)}" aria-label="+">+</button></div><button class="rm" data-rm="${esc(p.id)}">${t("remove")}</button></div>
      </div>`).join("")}
      <div class="rsum">
        <div><span>${t("subtotal")}</span><span class="num">${allTbc()?t("onWa"):money(subtotal())}</span></div>
        <div><span>${t("delivery")}</span><span class="num">${fee()==null?t("onWa"):money(fee())}</span></div>
        <div class="total"><span>${t("total")}</span><span class="num">${totalText()}</span></div>
      </div>
      ${hasTbc()?`<p class="rnote">${t("someTbc")}</p>`:""}
    </div>
  </section>
  <section class="deliver">
    <h2>${t("details")}</h2>
    <form id="orderForm" novalidate>
      <label>${t("name")}<input name="name" autocomplete="name"><span class="err" data-e="name"></span></label>
      <label>${t("phone")}<input name="phone" type="tel" inputmode="tel" autocomplete="tel"><span class="err" data-e="phone"></span></label>
      <label>${t("address")}<input name="address" autocomplete="street-address"><span class="err" data-e="address"></span></label>
      <label>${t("payment")}<select name="pay"><option value="cod">${t("cod")}</option><option value="whish">${t("whish")}</option><option value="omt">${t("omt")}</option></select></label>
      <label>${t("notes")}<textarea name="notes"></textarea></label>
    </form>
    <button class="btn wide send" id="sendBtn">${I.wa}<span>${t("send")}</span></button>
    <p class="send-note">${t("sendNote")}</p>
  </section></div>`;
}

/* ---------- router ---------- */
function route(){
  const h=location.hash;
  if(h.startsWith("#aisle-")) return {name:"home",anchor:h.slice(1)};
  const parts=h.replace(/^#\/?/,"").split("/").map(decodeURIComponent);
  if(parts[0]==="p") return {name:"detail",id:parts.slice(1).join("/")};
  if(parts[0]==="cart") return {name:"cart"};
  if(parts[0]==="shop" && parts[1]) return {name:"home",anchor:"aisle-"+slug(parts[1])};
  return {name:"home"};
}
function render(opts={}){
  saveDraft();
  const prev=current; current=route();
  const caret = opts.keepSearch && $("#q") ? $("#q").selectionStart : null;
  $("#view").innerHTML = current.name==="detail"?viewDetail(current.id): current.name==="cart"?viewCart(): viewHome();
  fillDraft(); renderRail(); updateCount();
  if(opts.keepSearch){ const q=$("#q"); q.focus(); if(caret!=null) q.setSelectionRange(caret,caret); }
  if(opts.scroll!==false){
    if(current.anchor){ const el=document.getElementById(current.anchor); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"}); }
    else if(prev.name!==current.name || current.name!=="home") window.scrollTo(0,0);
  }
}
function renderRail(){
  const onHome=current.name==="home" && !query.trim();
  $("#rail").innerHTML = categories().map(c=>`<a href="#aisle-${slug(c.en)}" data-aisle="aisle-${slug(c.en)}"><i class="dia" style="--c:${c.color}"></i>${esc(lang==="ar"?c.ar:c.en)}</a>`).join("");
  $("#rail").classList.toggle("hidden", !products.length);
  if(onHome) spy();
}
let spyObs;
function spy(){
  if(spyObs) spyObs.disconnect();
  if(!("IntersectionObserver" in window)) return;
  spyObs=new IntersectionObserver(es=>{ es.forEach(e=>{ if(e.isIntersecting){ document.querySelectorAll("#rail a").forEach(a=>a.setAttribute("aria-current",a.dataset.aisle===e.target.id)); } }); },{rootMargin:"-45% 0px -50% 0px"});
  document.querySelectorAll(".aisle[id]").forEach(s=>spyObs.observe(s));
}
function updateCount(){
  const n=Object.values(cart).reduce((a,b)=>a+b,0);
  document.querySelectorAll("[data-count]").forEach(el=>el.textContent=n);
  const bar=$("#orderbar"), show=n>0 && current.name!=="cart";
  bar.classList.toggle("off",!show); document.body.classList.toggle("has-bar",show);
  $("#orderbarTxt").textContent=`${t("viewOrder")} · ${count(n)}`;
  $("#orderbarTotal").textContent = allTbc()?"→":totalText();
}

/* ---------- basket actions ---------- */
function setQty(id,n,msg){
  const p=products.find(x=>x.id===id); if(!p||!p.available) return;
  const before=cart[id]||0; n=Math.max(0,Math.min(99,n));
  if(n) cart[id]=n; else delete cart[id];
  store.set("adira_cart",cart);
  if(msg) toast(msg); else if(!before&&n) toast(t("added"));
  const y=scrollY; render({scroll:false}); window.scrollTo(0,y);
}
function saveDraft(){ const f=$("#orderForm"); if(f){ draft=Object.fromEntries(new FormData(f)); store.set("adira_draft",draft); } }
function fillDraft(){ const f=$("#orderForm"); if(!f) return; for(const [k,v] of Object.entries(draft)) if(f.elements[k]) f.elements[k].value=v; }
function sendOrder(){
  saveDraft(); const d=draft; let ok=true;
  document.querySelectorAll(".err").forEach(e=>e.textContent="");
  const need=(k,m,test)=>{ if(!test((d[k]||"").trim())){ $(`[data-e=${k}]`).textContent=m; ok=false; } };
  need("name",t("needName"),v=>v.length>1);
  need("phone",t("needPhone"),v=>v.replace(/\D/g,"").length>=7);
  need("address",t("needAddress"),v=>v.length>2);
  if(!ok){ document.querySelector(".err:not(:empty)").parentElement.querySelector("input").focus(); return; }
  const pay={cod:t("cod"),whish:t("whish"),omt:t("omt")}[d.pay]||d.pay;
  const msg=[`*${t("msgHead")}*`,"",
    `${t("mName")}: ${d.name.trim()}`,`${t("mPhone")}: ${d.phone.trim()}`,`${t("mAddr")}: ${d.address.trim()}`,`${t("mPay")}: ${pay}`,"",
    `*${t("mItems")}:*`, ...cartItems().map(({p,n})=>`• ${n} × ${L(p,"name")} (${L(p,"unit")}) — ${lineText(p,n)}`),"",
    `${t("mSub")}: ${allTbc()?t("mTbc"):money(subtotal())}`, `${t("mDel")}: ${fee()==null?t("mTbc"):money(fee())}`, `*${t("mTotal")}: ${totalText(true)}*`,
    (d.notes||"").trim()?`\n${t("mNotes")}: ${d.notes.trim()}`:""].join("\n").trim();
  toast(t("opening"));
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`,"_blank","noopener");
}
let tt; function toast(m){ const el=$("#toast"); el.textContent=m; el.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("on"),2000); }

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang=lang; document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i]").forEach(el=>el.textContent=t(el.dataset.i));
  $("#q").placeholder=t("search"); $("#q").setAttribute("aria-label",t("search"));
  $("#langBtn").textContent=t("lang");
  $("#langBtn").setAttribute("aria-label",lang==="ar"?"Switch to English":"التبديل إلى العربية");
  store.set("adira_lang",lang); render({scroll:false});
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.inc) setQty(b.dataset.inc,(cart[b.dataset.inc]||0)+1);
  else if(b.dataset.dec) setQty(b.dataset.dec,(cart[b.dataset.dec]||0)-1);
  else if(b.dataset.rm){ delete cart[b.dataset.rm]; store.set("adira_cart",cart); render({scroll:false}); }
  else if(b.dataset.dq){ detailQty=Math.max(1,Math.min(99,detailQty+Number(b.dataset.dq))); $("#dq").textContent=detailQty; }
  else if(b.dataset.addn){ const id=b.dataset.addn, n=detailQty; detailQty=1; setQty(id,(cart[id]||0)+n,t("added")); }
  else if(b.hasAttribute("data-clear")){ query=""; $("#q").value=""; render(); }
  else if(b.id==="sendBtn") sendOrder();
  else if(b.id==="langBtn"){ lang=lang==="en"?"ar":"en"; applyLang(); }
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){ query=e.target.value; if(current.name!=="home"){ history.pushState(null,"","#/"); } render({keepSearch:true,scroll:false}); window.scrollTo(0,0); }
  else if(e.target.closest("#orderForm")){ const er=e.target.parentElement.querySelector(".err"); if(er) er.textContent=""; saveDraft(); }
});
window.addEventListener("hashchange",()=>{ detailQty=1; render(); });
document.querySelectorAll("[data-wa]").forEach(a=>a.href=`https://wa.me/${WHATSAPP_NUMBER}`);

loadProducts().then(list=>{ products=list; for(const id of Object.keys(cart)) if(!products.some(p=>p.id===id)) delete cart[id]; applyLang(); if(route().anchor) render(); });
</script>
</body>
